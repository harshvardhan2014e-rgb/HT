<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HN Notes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>HN Notes</h1>
        <p>Capture every idea.</p>
    </header>

    <hr>

    <!-- Search -->
    <section>
        <input type="text" id="searchInput" placeholder="🔍 Search notes...">
    </section>


    <!-- Note Input -->
    <section>
        <textarea id="noteInput" placeholder="Write your note here..." rows="8"></textarea>
    </section>


    <!-- Add Button -->
    <section>
        <button id="addBtn">+ Add Note</button>
    </section>

    <hr>

    <!-- Notes Container -->
    <main id="notesContainer">

        <article>
            <h2>Note Title</h2>
            <p>Note content preview...</p>

            <button>Edit</button>
            <button>Delete</button>
        </article>

        <article>
            <h2>Note Title</h2>
            <p>Note content preview...</p>

            <button>Edit</button>
            <button>Delete</button>
        </article>

        <article>
            <h2>Note Title</h2>
            <p>Note content preview...</p>

            <button>Edit</button>
            <button>Delete</button>
        </article>

    </main>

    <hr>

    <!-- Footer -->
    <footer>
        <p>© 2026 HN Notes. All rights reserved.</p>
    </footer>

<script src="script.js"></script>
</body>

</html>
